<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>咖啡厅重逢 · 互动小说</title>
<style>
  :root {
    --ink: #2b2724;
    --paper: #f3ede3;
    --paper-deep: #e8dfd0;
    --amber: #c9964a;
    --amber-glow: #f0c987;
    --rain: #7d94a8;
    --deep: #1c2430;
    --shadow: rgba(28, 36, 48, .35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
    background: #0e1319;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--ink);
  }
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 520px;
    max-height: 920px;
    margin: 0 auto;
    overflow: hidden;
    background: #101820;
    box-shadow: 0 0 80px rgba(0,0,0,.6);
  }
  @media (min-width: 560px) and (min-height: 940px) {
    #app { border-radius: 22px; height: 92vh; }
  }

  /* ===== 场景背景层 ===== */
  .bg-layer { position: absolute; inset: 0; overflow: hidden; }
  .bg-scene {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transform: scale(1.08);
    transition: opacity 1.1s ease, transform 1.6s ease;
    filter: blur(5px) brightness(.66) saturate(1.05);
  }
  .bg-scene.active { opacity: 1; transform: scale(1.02); }

  /* 各场景用渐变+氛围色构建，插入漫画画面作底图 */
  .scene-01 { background-image: linear-gradient(180deg, rgba(30,40,55,.55), rgba(20,28,38,.75)), url('assets/comic/page1.png'); }
  .scene-02 { background-image: linear-gradient(180deg, rgba(28,36,48,.5), rgba(18,24,32,.7)), url('assets/comic/page1.png'); }
  .scene-03 { background-image: linear-gradient(180deg, rgba(28,36,48,.5), rgba(18,24,32,.72)), url('assets/comic/page1.png'); }
  .scene-04 { background-image: linear-gradient(180deg, rgba(30,36,46,.48), rgba(16,22,30,.7)), url('assets/comic/page2.png'); }
  .scene-05 { background-image: linear-gradient(180deg, rgba(32,36,44,.42), rgba(18,22,30,.66)), url('assets/comic/page2.png'); }
  .scene-06 { background-image: linear-gradient(180deg, rgba(34,36,42,.4), rgba(20,22,28,.62)), url('assets/comic/page2.png'); }
  .scene-07 { background-image: linear-gradient(180deg, rgba(32,34,40,.4), rgba(20,22,28,.64)), url('assets/comic/page3.png'); }
  .scene-08 { background-image: linear-gradient(180deg, rgba(32,34,40,.42), rgba(20,22,28,.66)), url('assets/comic/page3.png'); }
  .scene-09 { background-image: linear-gradient(180deg, rgba(30,34,42,.4), rgba(18,22,28,.62)), url('assets/comic/page4.png'); }
  .scene-10 { background-image: linear-gradient(180deg, rgba(30,34,42,.38), rgba(18,22,28,.6)), url('assets/comic/page4.png'); }
  .scene-title { background-image: linear-gradient(180deg, rgba(16,24,34,.62), rgba(12,18,26,.8)), url('assets/comic/page1.png'); }

  /* 雨滴 */
  .rain-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .rain {
    position: absolute; top: -10%;
    width: 1px; height: 60px;
    background: linear-gradient(180deg, transparent, rgba(200,220,235,.5));
    animation: fall linear infinite;
  }
  @keyframes fall { to { transform: translateY(120vh); } }

  /* 光晕粒子 */
  .bokeh { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(1px); animation: float 7s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) ; opacity: .5;} 50% { transform: translateY(-18px); opacity: .85; } }

  /* 暖光叠加 */
  .warm-glow {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 72% 30%, rgba(240,190,110,.16), transparent 55%);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 140px 30px rgba(10,14,20,.72);
  }

  /* ===== 顶部 HUD ===== */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 22px 14px;
    z-index: 6;
    background: linear-gradient(180deg, rgba(10,15,22,.62), transparent);
    color: #f0e8da;
  }
  .chapter-tag { font-size: 12px; letter-spacing: 2px; opacity: .82; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .chapter-tag b { display: block; font-size: 15px; letter-spacing: 3px; font-weight: 600; margin-top: 3px; opacity: 1; }
  .heart-box { text-align: right; }
  .heart-label { font-size: 10px; letter-spacing: 2px; opacity: .7; }
  .hearts { display: flex; gap: 3px; justify-content: flex-end; margin-top: 5px; }
  .heart {
    font-size: 15px; line-height: 1;
    color: rgba(255,255,255,.22);
    transition: color .5s, transform .4s, text-shadow .4s;
  }
  .heart::before { content: '♥'; }
  .heart.on { color: #ffb563; text-shadow: 0 0 8px rgba(240,160,80,.85); }
  .hearts.pulse { animation: heartPulse .6s ease; }
  @keyframes heartPulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.28); filter: drop-shadow(0 0 10px rgba(255,170,90,.8)); }
    100% { transform: scale(1); }
  }
  /* 勇气：呼吸光点，不显示数值 */
  .courage { display: flex; gap: 5px; justify-content: flex-end; margin-top: 7px; }
  .spark {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(150,190,220,.18);
    border: 1px solid rgba(170,205,235,.25);
    transition: background .5s, box-shadow .5s, border-color .5s;
  }
  .spark.on {
    background: radial-gradient(circle, #dff0ff, #8fc4ea);
    border-color: #cfe8ff;
    box-shadow: 0 0 8px rgba(150,205,245,.9);
    animation: breathe 2.8s ease-in-out infinite;
  }
  .spark.on:nth-child(2) { animation-delay: .35s; }
  .spark.on:nth-child(3) { animation-delay: .7s; }
  .spark.on:nth-child(4) { animation-delay: 1.05s; }
  @keyframes breathe { 0%,100% { opacity: .75; transform: scale(.9);} 50% { opacity: 1; transform: scale(1.15);} }
  .courage.dim .spark.on { animation: breatheLow 1s ease-in-out infinite; }
  @keyframes breatheLow { 0%,100% { opacity: .45;} 50% { opacity: .85;} }

  /* 勇气的诗意提示 toast */
  .poem-toast {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) translateY(10px);
    z-index: 22; pointer-events: none;
    max-width: 78%; text-align: center;
    font-size: 13px; line-height: 1.8; letter-spacing: 1px;
    color: #e8dcc4; font-style: italic;
    text-shadow: 0 2px 14px rgba(0,0,0,.9);
    opacity: 0; transition: opacity .8s, transform .8s;
  }
  .poem-toast.show { opacity: 1; transform: translate(-50%, -50%) translateY(0); }

  /* 选择禁用态 */
  .choice.locked { opacity: .46; cursor: not-allowed; filter: grayscale(.5); }
  .choice.locked:hover { transform: none; box-shadow: 0 6px 22px rgba(0,0,0,.32); border-color: rgba(190,155,100,.6); }
  .choice .lock { margin-left: auto; font-size: 11px; color: #8a7a62; letter-spacing: 1px; white-space: nowrap; }

  /* ===== 对话框 ===== */
  .dialogue-wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 16px 20px;
    z-index: 8;
  }
  .dialogue {
    position: relative;
    background: linear-gradient(180deg, rgba(247,242,232,.97), rgba(238,230,216,.98));
    border: 1px solid rgba(180,150,105,.5);
    border-radius: 10px;
    padding: 18px 20px 20px;
    min-height: 128px;
    box-shadow: 0 10px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .dialogue::before {
    content: ''; position: absolute; top: -1px; left: 22px; right: 22px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent); opacity: .7;
  }
  .speaker {
    display: inline-block;
    font-size: 12px; letter-spacing: 2px; font-weight: 700;
    color: #fff; background: linear-gradient(135deg, #b98a45, #9c6d33);
    padding: 4px 12px; border-radius: 20px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(160,110,50,.35);
  }
  .speaker.narration { background: linear-gradient(135deg, #5c6b7a, #3f4c59); }
  .speaker.him { background: linear-gradient(135deg, #6d7f8c, #4a5b68); }
  .speaker.her { background: linear-gradient(135deg, #c98d84, #a8635c); }
  .text {
    font-size: 15.5px; line-height: 1.85; letter-spacing: .5px;
    color: var(--ink); min-height: 56px;
    white-space: pre-wrap;
  }
  .text .cursor { display: inline-block; width: 7px; height: 16px; background: var(--amber); vertical-align: -2px; margin-left: 2px; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .next-hint {
    position: absolute; right: 18px; bottom: 12px;
    font-size: 11px; color: #a08c6c; letter-spacing: 1px;
    animation: bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .55;} 50% { transform: translateY(4px); opacity: 1; } }

  /* ===== 选择面板 ===== */
  .choices-wrap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 16px 22px; z-index: 9;
    display: none;
  }
  .choices-wrap.show { display: block; animation: riseIn .5s ease both; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(24px);} to { opacity:1; transform: translateY(0);} }
  .choice-prompt {
    text-align: center; color: #f3e7d2; font-size: 13px; letter-spacing: 1px;
    margin-bottom: 14px; text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  .choice {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    padding: 15px 18px; margin-bottom: 10px;
    background: linear-gradient(135deg, rgba(248,243,233,.96), rgba(236,227,211,.96));
    border: 1px solid rgba(190,155,100,.6);
    border-radius: 10px;
    font-size: 14.5px; color: var(--ink); letter-spacing: .3px; line-height: 1.5;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(0,0,0,.32);
    transition: transform .22s, box-shadow .22s, border-color .22s;
    animation: choiceIn .5s ease both;
  }
  .choice:nth-child(2) { animation-delay: .08s; }
  .choice:nth-child(3) { animation-delay: .16s; }
  @keyframes choiceIn { from { opacity:0; transform: translateX(-16px);} to { opacity:1; transform: translateX(0);} }
  .choice .num {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #c9964a, #a16f2e); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .choice:hover { transform: translateY(-2px) scale(1.01); border-color: var(--amber); box-shadow: 0 10px 30px rgba(180,120,50,.35); }
  .choice:active { transform: scale(.98); }

  /* ===== 标题屏 ===== */
  .screen { position: absolute; inset: 0; z-index: 20; display: none; }
  .screen.active { display: flex; }
  #titleScreen {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #f4ead8;
  }
  .title-deco { font-size: 11px; letter-spacing: 6px; color: var(--amber-glow); margin-bottom: 20px; opacity: 0; animation: fadeDown 1s .2s ease forwards; }
  .title-main {
    font-size: 42px; letter-spacing: 8px; font-weight: 700;
    text-shadow: 0 4px 24px rgba(0,0,0,.7), 0 0 40px rgba(240,190,110,.25);
    opacity: 0; animation: fadeDown 1s .45s ease forwards;
    padding-left: 8px;
  }
  .title-sub { font-size: 13px; letter-spacing: 5px; opacity: 0; margin-top: 14px; color: #d9c8ac; animation: fadeDown 1s .75s ease forwards; }
  .title-line { width: 60px; height: 1px; background: var(--amber); margin: 26px 0; opacity: 0; animation: fadeIn 1s 1s ease forwards; }
  @keyframes fadeDown { from { opacity:0; transform: translateY(-18px);} to { opacity:1; transform: translateY(0);} }
  @keyframes fadeIn { to { opacity: .8; } }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 13px 40px; font-size: 15px; letter-spacing: 4px;
    color: #2b2724; cursor: pointer;
    background: linear-gradient(135deg, #f3d9a8, #d8a75e);
    border: 1px solid #f6e2bd; border-radius: 30px;
    box-shadow: 0 6px 26px rgba(200,150,70,.4), inset 0 1px 0 rgba(255,255,255,.6);
    transition: transform .25s, box-shadow .25s;
    opacity: 0; animation: fadeUp 1s 1.2s ease forwards;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(18px);} to { opacity:1; transform: translateY(0);} }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 34px rgba(210,160,80,.55); }
  .btn:active { transform: scale(.96); }
  .btn.ghost {
    background: transparent; color: #e8d8bd; border-color: rgba(232,216,189,.5);
    box-shadow: none; padding: 10px 26px; font-size: 12px; letter-spacing: 3px;
  }
  .btn.ghost:hover { background: rgba(232,216,189,.1); }
  .title-gallery { margin-top: 22px; opacity: 0; animation: fadeIn 1s 1.6s ease forwards; }

  /* ===== 章节转场 ===== */
  .chapter-card {
    position: absolute; inset: 0; z-index: 15;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(18,24,32,.82), rgba(8,12,18,.96));
    color: #f0e5d2; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .7s;
  }
  .chapter-card.show { opacity: 1; pointer-events: auto; }
  .cc-num { font-size: 13px; letter-spacing: 6px; color: var(--amber-glow); margin-bottom: 16px; }
  .cc-title { font-size: 30px; letter-spacing: 8px; font-weight: 600; text-shadow: 0 3px 20px rgba(0,0,0,.6); }
  .cc-sub { font-size: 12px; letter-spacing: 4px; opacity: .6; margin-top: 16px; }
  .cc-line { width: 40px; height: 1px; background: var(--amber); margin: 22px 0; opacity: .7; }

  /* ===== 结局屏 ===== */
  .ending { flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding: 46px 30px 30px; color: #f2e7d4; overflow-y: auto; }
  .ending::-webkit-scrollbar { width: 0; }
  .ending-icon, .ending-title, .ending-en { flex-shrink: 0; }
  .ending-icon { font-size: 40px; margin-bottom: 18px; filter: drop-shadow(0 0 18px rgba(240,190,110,.5)); }
  .ending-title { font-size: 30px; letter-spacing: 7px; font-weight: 700; text-shadow: 0 4px 22px rgba(0,0,0,.7); }
  .ending-en { font-size: 11px; letter-spacing: 5px; color: var(--amber-glow); margin-top: 12px; opacity: .85; }
  .ending-text { font-size: 13.5px; line-height: 2.05; letter-spacing: 1px; margin-top: 20px; color: #e2d5bd; text-shadow: 0 2px 8px rgba(0,0,0,.5); white-space: pre-line; flex-shrink: 0; }
  .missed-box { width: 100%; margin-top: 22px; padding: 14px 14px 10px; border-top: 1px solid rgba(200,160,100,.3); border-bottom: 1px solid rgba(200,160,100,.3); flex-shrink: 0; }
  .missed-title { font-size: 11px; letter-spacing: 3px; color: #b99a68; margin-bottom: 10px; }
  .missed-list { display: flex; flex-direction: column; gap: 7px; }
  .missed-item { font-size: 11.5px; line-height: 1.6; color: #9c8f7c; font-style: italic; text-align: left; padding-left: 12px; position: relative; }
  .missed-item::before { content: '·'; position: absolute; left: 2px; color: #b99a68; }
  .ending-btns { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; flex-shrink: 0; }
  .ending .btn { animation: fadeUp .7s .25s ease forwards; }
  .gallery .btn { animation: none; opacity: 1; }

  /* ===== 视角选择 ===== */
  .pov-screen { flex-direction: column; align-items: center; justify-content: center; padding: 30px 22px; background: linear-gradient(180deg, rgba(12,18,26,.86), rgba(8,12,18,.95)); }
  .pov-deco { font-size: 10px; letter-spacing: 5px; color: var(--amber-glow); margin-bottom: 14px; text-align: center; animation: fadeDown 1s .1s ease both; }
  .pov-title { font-size: 25px; letter-spacing: 6px; color: #f2e7d4; font-weight: 600; text-shadow: 0 3px 18px rgba(0,0,0,.6); animation: fadeDown 1s .2s ease both; }
  .pov-sub { font-size: 12px; letter-spacing: 3px; color: #a99a80; margin-top: 12px; margin-bottom: 30px; text-align: center; animation: fadeDown 1s .32s ease both; }
  .pov-cards { display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 360px; }
  .pov-card {
    position: relative; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; gap: 16px;
    padding: 20px 18px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(60,48,40,.82), rgba(32,28,26,.9));
    border: 1px solid rgba(200,150,80,.35);
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
    transition: transform .28s, border-color .28s, box-shadow .28s;
    opacity: 0; animation: fadeUp .8s .5s ease both;
  }
  .pov-card:nth-child(2) { animation-delay: .66s; }
  .pov-card:nth-child(1) { background: linear-gradient(135deg, rgba(120,80,76,.78), rgba(45,32,32,.92)); border-color: rgba(220,150,140,.4); }
  .pov-card:nth-child(2) { background: linear-gradient(135deg, rgba(74,92,108,.8), rgba(30,38,48,.92)); border-color: rgba(140,175,200,.4); }
  .pov-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 14px 38px rgba(0,0,0,.55); }
  .pov-card:nth-child(1):hover { border-color: #e0a090; }
  .pov-card:nth-child(2):hover { border-color: #9dc4e0; }
  .pov-card:active { transform: scale(.98); }
  .pov-avatar {
    flex: 0 0 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: #fff;
    box-shadow: inset 0 2px 8px rgba(255,255,255,.2), 0 4px 14px rgba(0,0,0,.4);
  }
  .pov-her .pov-avatar { background: linear-gradient(135deg, #d99a90, #a35f58); }
  .pov-him .pov-avatar { background: linear-gradient(135deg, #7f9bad, #4c6273); }
  .pov-info { flex: 1; }
  .pov-name { font-size: 19px; letter-spacing: 3px; color: #f5ead8; font-weight: 600; }
  .pov-role { font-size: 11px; letter-spacing: 2px; color: var(--amber-glow); margin-top: 3px; }
  .pov-desc { font-size: 11.5px; line-height: 1.6; color: #c3b7a4; margin-top: 8px; }
  .pov-arrow { font-size: 22px; color: rgba(240,220,190,.5); }
  .pov-back { margin-top: 28px; }

  /* 视角标识 */
  .pov-badge {
    display: inline-block; font-size: 10px; letter-spacing: 2px;
    padding: 3px 10px; border-radius: 12px; margin-bottom: 8px;
    background: rgba(200,150,80,.2); border: 1px solid rgba(220,170,100,.5); color: #f0d9ae;
  }
  .pov-badge.her { background: rgba(200,120,110,.2); border-color: rgba(220,150,140,.5); color: #f0c0b8; }
  .pov-badge.him { background: rgba(120,160,190,.2); border-color: rgba(150,190,220,.5); color: #c0dcf0; }

  /* ===== 画廊 ===== */
  .gallery { z-index: 30; background: rgba(10,14,20,.96); flex-direction: column; padding: 24px 20px; }
  .gallery h2 { color: #f0e5d2; font-size: 18px; letter-spacing: 6px; font-weight: 500; margin-bottom: 6px; }
  .gallery .g-sub { color: #9a8c78; font-size: 11px; letter-spacing: 2px; margin-bottom: 20px; }
  .gallery-scroll { flex: 1; overflow-y: auto; width: 100%; display: flex; flex-direction: column; gap: 16px; padding: 4px; }
  .gallery-scroll img { width: 100%; border-radius: 6px; border: 1px solid rgba(200,160,100,.3); box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .gallery-close { margin-top: 18px; }

  /* 提示 toast */
  .toast {
    position: absolute; top: 92px; left: 50%; transform: translateX(-50%) translateY(-10px);
    background: rgba(20,26,34,.88); color: #f0d9ae; border: 1px solid rgba(220,180,110,.4);
    padding: 8px 18px; border-radius: 20px; font-size: 12px; letter-spacing: 1px;
    z-index: 25; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <!-- 背景 -->
  <div class="bg-layer" id="bgLayer">
    <div class="bg-scene scene-title active" data-scene="title"></div>
    <div class="bg-scene scene-01" data-scene="s01"></div>
    <div class="bg-scene scene-02" data-scene="s02"></div>
    <div class="bg-scene scene-03" data-scene="s03"></div>
    <div class="bg-scene scene-04" data-scene="s04"></div>
    <div class="bg-scene scene-05" data-scene="s05"></div>
    <div class="bg-scene scene-06" data-scene="s06"></div>
    <div class="bg-scene scene-07" data-scene="s07"></div>
    <div class="bg-scene scene-08" data-scene="s08"></div>
    <div class="bg-scene scene-09" data-scene="s09"></div>

  for (let i=0;i<46;i++){

    r.style.animationDuration = (0.55+Math.random()*0.8)+'s';
    r.style.animationDelay = (-Math.random()*2)+'s';
    r.style.opacity = (0.2+Math.random()*0.5);
    layer.appendChild(r);
  }
  const colors=['rgba(245,200,130,.55)','rgba(255,225,170,.4)','rgba(200,215,230,.35)'];
  for(let i=0;i<12;i++){
    const b=document.createElement('div');
    b.className='bokeh';
    const s=4+Math.random()*10;
    b.style.width=s+'px'; b.style.height=s+'px';
    b.style.left=Math.random()*100+'%';
    b.style.top=Math.random()*80+'%';
    b.style.background=colors[i%colors.length];
    b.style.animationDelay=(-Math.random()*7)+'s';
    b.style.animationDuration=(5+Math.random()*5)+'s';
    layer.appendChild(b);
  }
})();

/* ===== 状态：心动 + 勇气（隐性资源） ===== */
let heart = 0;
let courage = 3;          // 初始勇气 3
const MAX_COURAGE = 4;    // 上限 4，不向玩家显示数值
let missed = [];          // 记录每个选择点"另一条路"
let spokeTruth = false;   // 是否在结尾说出了那句关键的话（需勇气≥2）

function renderCourage(){
  const box=$('courage'); box.innerHTML='';
  for(let i=0;i<MAX_COURAGE;i++){
    const sp=document.createElement('div');
    sp.className='spark'+(i<courage?' on':'');
    box.appendChild(sp);
  }
  box.classList.toggle('dim', courage<=1);
}
function changeCourage(n){
  const before=courage;
  courage=Math.max(0, Math.min(MAX_COURAGE, courage+n));
  if(courage!==before){
    renderCourage();
    // 勇气下降时，光点轻微收缩一下
    if(n<0){ const box=$('courage'); box.style.transform='scale(.86)'; setTimeout(()=>box.style.transform='',260); }
  }
}

/* 诗意提示：文字缓慢浮现再消散 */
let poemTimer;
function showPoem(msg){
  const el=$('poemToast'); el.textContent=msg;
  el.classList.add('show');
  clearTimeout(poemTimer);
  poemTimer=setTimeout(()=>el.classList.remove('show'), 2200);
}

const MAX_HEART = 8;
function renderHearts(){
  const box=$('hearts'); box.innerHTML='';
  for(let i=0;i<MAX_HEART;i++){
    const h=document.createElement('div');
    h.className='heart'+(i<heart?' on':'');
    box.appendChild(h);
  }
}
function addHeart(n){
  const before=heart;
  heart=Math.min(MAX_HEART, heart+n);
  if(heart===before) return;
  renderHearts();
  // 沉浸反馈：心形整体轻轻搏动一次，不显示数值
  const box=$('hearts');
  box.classList.remove('pulse');
  void box.offsetWidth;
  box.classList.add('pulse');
}

/* toast */
let toastTimer;
function showToast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 1600);
}

/* 场景切换 */
let currentScene='title';
function setScene(s){
  if(s===currentScene) return;
  document.querySelectorAll('.bg-scene').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector('.bg-scene[data-scene="'+s+'"]');
  if(el) el.classList.add('active');
  currentScene=s;
}

}

/* 视角映射：根据当前视角取对应的剧情与结局 */
const VIEW = {
  her: { story:storyHer, endings:endingsHer, name:'知微', badge:'她的视角 · 奔赴', badgeClass:'her' },
  him: { story:storyHim, endings:endingsHim, name:'亭神', badge:'他的视角 · 等待', badgeClass:'him' }
};
let pov = 'her';

/* ============ 游戏控制 ============ */
let typing=false, typeTimer=null, skipType=false, waitingChoice=false;

async function typeText(el, str){
  return new Promise(resolve=>{
    let i=0; el.innerHTML='';
    const cursor=document.createElement('span'); cursor.className='cursor';
    const speed=28;
    function step(){
      if(skipType){
        el.textContent=str; el.appendChild(cursor);
        typeTimer=null; resolve(); return;
      }
      if(i<str.length){
        el.textContent=str.slice(0,++i);
        el.appendChild(cursor);
        typeTimer=setTimeout(step, str[i-1]==='\n'?90:speed);
      } else {
        el.textContent=str; el.appendChild(cursor);
        typeTimer=null; resolve();
      }
    }
    step();
  });
}

async function playLines(lines){
  for(const ln of lines){
    if(ln.scene) setScene(ln.scene);
    const sp=$('speaker');
    sp.textContent = ln.s==='narration'?'旁白' : ln.s==='him'?'亭神' : '知微';
    sp.className='speaker '+(ln.s==='narration'?'narration':ln.s==='him'?'him':'her');
    $('nextHint').style.display='block';
    skipType=false; typing=true;
    const p=typeText($('text'), ln.t);
    await waitAdvance();
    skipType=true;
    await p;
    typing=false;
  }
}

function waitAdvance(){
  return new Promise(resolve=>{
    function handler(e){
      if(waitingChoice) return;
      if(e.type==='click' && (e.target.closest('#choicesWrap')||e.target.closest('.btn'))) return;
      document.removeEventListener('click', handler, true);
      resolve();
    }
    document.addEventListener('click', handler, true);
  });
}

async function showChoices(node){
  waitingChoice=true;
  $('dialogueWrap').style.display='none';
  $('choicesWrap').classList.add('show');
  $('choicePrompt').textContent=node.prompt;
  if(node.scene) setScene(node.scene);
  const list=$('choicesList'); list.innerHTML='';
  node.choices.forEach((c,i)=>{
    const locked = (c.need||0) > courage;   // 勇气不足则锁定
    const b=document.createElement('button');
    b.className='choice'+(locked?' locked':'');
    b.innerHTML='<span class="num">'+(i+1)+'</span><span>'+c.text+'</span>'+
                (locked?'<span class="lock">勇气不足</span>':'');
    b.onclick=async()=>{
      if(waitingChoice===false) return;
      if(locked){ showPoem('这句话到了嘴边，却终究没有那份勇气说出口。'); return; }
      waitingChoice=false;
      $('choicesWrap').classList.remove('show');
      if(c.heart) addHeart(c.heart);
      if(c.cr) changeCourage(c.cr);
      if(c.climax) spokeTruth=true;   // 说出了那句攒了十年的话
      // 记录被放弃的"另一条路"：取本选择点里心动最高的未选项
      const best = node.choices.slice().sort((a,b2)=>(b2.heart||0)-(a.heart||0))[0];
      if(best && best!==c && best.lost) missed.push(best.lost);
      await sleep(280);
      // 闪现代价残影：另一个自己的选择
      if(c.lost){ showPoem('（另一个你：'+c.lost+'）'); await sleep(1500); }
      // 播放该选项专属的即时反馈
      if(c.reply && c.reply.length){
        $('dialogueWrap').style.display='block';
        await playLines(c.reply);
      }
      if(c.next==='endingCheck') decideEnding();
      else playNode(c.next);
    };
    list.appendChild(b);
  });
}

function showEnding(key){
  const v = VIEW[pov];
  const e = v.endings[key];
  if(key==='miss') setScene('s03');
  $('toast').classList.remove('show');
  $('hud').style.display='none';
  $('dialogueWrap').style.display='none';
  $('choicesWrap').classList.remove('show');
  const badge=$('endPovBadge');
  badge.textContent=v.badge;
  badge.className='pov-badge '+v.badgeClass;
  $('endIcon').textContent=e.icon;
  $('endTitle').textContent=e.title;
  $('endEn').textContent=e.en;
  $('endText').textContent=e.text;
  // 错过的瞬间
  const ml=$('missedList'); ml.innerHTML='';
  missed.forEach(t=>{
    const d=document.createElement('div');
    d.className='missed-item'; d.textContent=t;
    ml.appendChild(d);
  });
  setTimeout(()=>{
    $('povScreen').classList.remove('active');
    $('endingScreen').classList.add('active');
  }, 500);
}

function decideEnding(){
  // 完美结局的门槛不只是心动，更需要"在最后鼓起勇气说出那句话"。
  // 一路莽到勇气耗尽的人，在最该开口的时刻会失声——这正是选择的代价。
  if(spokeTruth && heart>=5) showEnding('perfect');
  else if(heart>=3) showEnding('normal');
  else showEnding('miss');
}

async function playNode(id){
  const node=VIEW[pov].story[id];
  if(!node) return;
  if(node.chapter){
    $('chapterTag').textContent=node.chapter[1];
    await showChapter(node.chapter[0], node.chapter[2], node.chapter[3]);
  }
  if(node.lines){ await playLines(node.lines); }
  if(node.choices){ await showChoices(node); }
  else if(node.next){ playNode(node.next); }
}

/* ============ 初始化 ============ */
async function startGame(selectedPov){
  pov = selectedPov || pov;
  heart=0; renderHearts();
  courage=3; renderCourage();
  missed=[];
  $('poemToast').classList.remove('show');
  $('titleScreen').classList.remove('active');
  $('povScreen').classList.remove('active');
  $('endingScreen').classList.remove('active');
  $('galleryScreen').classList.remove('active');
  $('hud').style.display='flex';
  // HUD 视角标签
  const v=VIEW[pov];
  $('hudPovBadge').textContent=v.name+(pov==='her'?' · 她':' · 他');
  $('hudPovBadge').className='pov-badge '+v.badgeClass;
  $('dialogueWrap').style.display='block';
  $('choicesWrap').classList.remove('show');
  setScene('s01');
  await sleep(300);
  playNode('start');
}

function showPovScreen(){
  $('titleScreen').classList.remove('active');
  $('endingScreen').classList.remove('active');
  $('hud').style.display='none';
  $('povScreen').classList.add('active');
}
function showTitle(){
  $('povScreen').classList.remove('active');
  $('titleScreen').classList.add('active');
}

$('startBtn').onclick=showPovScreen;
$('cardHer').onclick=()=>startGame('her');
$('cardHim').onclick=()=>startGame('him');
$('povBack').onclick=showTitle;
// 结局页「再走一遍」回到视角选择，可换角度重玩
$('restartBtn').onclick=showPovScreen;
$('galleryBtnTitle').onclick=()=>{ $('galleryScreen').classList.add('active'); };
$('galleryBtnEnd').onclick=()=>{ $('galleryScreen').classList.add('active'); };
$('galleryClose').onclick=()=>{ $('galleryScreen').classList.remove('active'); };

renderHearts();
renderCourage();
</script>
